<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3455a4"><link rel="manifest" href="manifest.json"><title>Vocabulary Club</title><style>body{font:18px system-ui;background:#eef2ff;color:#23304d;margin:auto;max-width:760px;padding:20px}button,select,input,textarea{font:inherit;padding:12px;border:1px solid #bcc8e2;border-radius:12px;margin:5px 0;box-sizing:border-box}button{background:#3455a4;color:white;cursor:pointer}nav{display:flex;flex-wrap:wrap;gap:8px}article{background:white;padding:24px;border-radius:22px;margin:20px 0;text-align:center}#card{min-height:220px;display:grid;place-content:center;cursor:pointer;white-space:pre-wrap;font-size:30px;width:100%;background:white;color:#23304d}textarea,input,select{width:100%}.choice{display:block;width:100%;background:#e8edff;color:#23304d;text-align:left}.good{background:#21754b;color:white}.bad{background:#a33b43;color:white}small{color:#52617d}</style><h1>Vocabulary Club</h1><select id="lesson" aria-label="Lesson"></select><nav><button onclick="start('flash')">Flashcards</button><button onclick="start('quiz')">Quiz</button><button onclick="start('review')">Review missed</button><button onclick="edit()">Add / edit words</button><button onclick="backup()">Backup</button><button onclick="document.getElementById('restore').click()">Restore</button><input hidden type="file" id="restore" accept="application/json"></nav><main id="main"></main><script>
const seed=`bluff (n): a steep bank, cliff, or headland
bluff (v): to mislead, deceive, or fool
incense (n): a substance that burns with a pleasant odor
incense (v): to make angry; to infuriate
poach (v): to cook in a hot or boiling liquid
poach (v): to trespass in order to take fish or game
flounder (n): a kind of fish
flounder (v): to move in a struggling, clumsy manner
object (n): a thing
object (v): to protest
stoop (n): a small porch, staircase, or platform leading to the entrance of a building
stoop (v): to bend forward from the waist`;
function parse(s){return s.split(/\n/).filter(x=>x.trim()).map(x=>{let m=x.match(/^\s*(?:\d+\.\s*)?(.+?)\s*\(([nv]|noun|verb|adj|adv)\)\s*:\s*(.+)$/i);if(!m)throw Error('Check this line: '+x);return {w:m[1].replace(/\s*\([^)]*\)\s*$/,'').trim(),p:m[2],d:m[3],miss:false}})}let db;try{db=JSON.parse(localStorage.getItem('vocabClub'))}catch{}if(!db)db={'Lesson 1':parse(seed)};const main=document.getElementById('main'),lesson=document.getElementById('lesson');let queue=[],i=0,score=0,mode='flash',shown=false;function save(){try{localStorage.setItem('vocabClub',JSON.stringify(db))}catch{alert('Storage unavailable. Please back up your words.')}}function refresh(name){lesson.replaceChildren();Object.keys(db).forEach(k=>lesson.add(new Option(k,k)));if(name)lesson.value=name}function el(tag,t,cls){let e=document.createElement(tag);e.textContent=t;if(cls)e.className=cls;return e}function btn(t,f,cls){let e=el('button',t,cls);e.onclick=f;return e}function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function start(m){mode=m;queue=shuffle(db[lesson.value].filter(x=>m!=='review'||x.miss));i=score=0;render()}function render(){main.replaceChildren();let a=el('article','');main.append(a);if(i>=queue.length){a.append(el('h2',queue.length?`Finished! ${score} / ${queue.length}`:'No missed words!'),btn('Study again',()=>start(mode)));return}let c=queue[i];a.append(el('small',`${i+1} / ${queue.length}`),el('h2',c.w+' ('+c.p+')'),btn('🔊 Listen',()=>{if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(c.w);u.lang='en-US';speechSynthesis.speak(u)}}));let rate=ok=>{c.miss=!ok;save();if(ok)score++;i++;render()};if(mode!=='quiz'){shown=false;let card=btn('Tap to reveal',()=>{if(shown)return;shown=true;card.textContent=c.d;controls.hidden=false});card.id='card';let controls=el('div','');controls.hidden=true;controls.append(btn('✓ I knew it',()=>rate(true),'good'),document.createTextNode(' '),btn('× Still learning',()=>rate(false),'bad'));a.append(card,controls)}else{let valid=[...new Set(db[lesson.value].filter(x=>x.w!==c.w||x.p!==c.p).map(x=>x.d))].filter(d=>d!==c.d);let options=shuffle([c.d,...shuffle(valid).slice(0,3)]);a.append(el('p','Choose the correct meaning.'));let locked=false;options.forEach(d=>a.append(btn(d,()=>{if(locked)return;locked=true;let ok=d===c.d;a.append(el('p',ok?'Correct!':'Correct answer: '+c.d),btn('Next',()=>rate(ok)));},'choice')))}}function edit(){main.replaceChildren();let a=el('article',''),name=el('input',''),ta=el('textarea','');name.value=lesson.value;ta.rows=12;ta.value=db[lesson.value].map(x=>`${x.w} (${x.p}): ${x.d}`).join('\n');a.append(el('h2','Add or edit a lesson'),el('p','One meaning per line: word (n): definition'),name,ta,btn('New lesson',()=>{name.value='';ta.value='';name.focus()}),btn('Save lesson',()=>{try{let n=name.value.trim(),v=parse(ta.value);if(!n||!v.length)throw Error('Enter a lesson name and words.');if(db[n]&&n!==lesson.value&&!confirm('Replace this lesson?'))return;v.forEach(x=>{let old=db[n]?.find(y=>y.w===x.w&&y.p===x.p&&y.d===x.d);if(old)x.miss=old.miss});db[n]=v;save();refresh(n);start('flash')}catch(e){alert(e.message)}}));main.append(a)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='vocabulary-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.getElementById('restore').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!v||typeof v!=='object'||!Object.keys(v).length||!Object.values(v).every(a=>Array.isArray(a)&&a.length&&a.every(x=>typeof x.w==='string'&&typeof x.p==='string'&&typeof x.d==='string')))throw Error();if(confirm('Replace all lessons with backup?')){db=v;save();refresh();start('flash')}}catch{alert('Invalid backup file')}e.target.value=''};lesson.onchange=()=>start('flash');refresh();start('flash');if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
